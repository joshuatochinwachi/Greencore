version: "3.9"

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: greencore_postgres
    environment:
      POSTGRES_USER: greencore
      POSTGRES_PASSWORD: greencore_dev
      POSTGRES_DB: greencore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: greencore_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
