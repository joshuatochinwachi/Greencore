name: Greencore CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test-backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    # Spin up a throwaway Postgres for CI — production DB is never touched
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: greencore
          POSTGRES_PASSWORD: greencore_dev
          POSTGRES_DB: greencore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/api/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Migrations
        env:
          DATABASE_URL: postgresql://greencore:greencore_dev@localhost:5432/greencore_test
          ENVIRONMENT: "development"
        run: |
          alembic upgrade head

      - name: Run Pytest
        env:
          # Always use the isolated CI test DB — never the production secret
          DATABASE_URL: postgresql://greencore:greencore_dev@localhost:5432/greencore_test
          JWT_SECRET: "ci-secret-for-automated-tests-only-not-for-production-use"
          ENVIRONMENT: "development"
        run: |
          pytest
